<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频语音替换工具</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  .step { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .step h2 { margin-top: 0; font-size: 16px; }
  textarea { width: 100%; height: 220px; font-family: Consolas, monospace; font-size: 14px; box-sizing: border-box; }
  button { padding: 8px 18px; background: #2d6cdf; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .hint { color: #888; font-size: 13px; }
  .error { color: #c0392b; font-size: 13px; white-space: pre-wrap; }
  .hidden { display: none; }
  #downloadLink { display: inline-block; margin-top: 10px; }
</style>
</head>
<body>

<h1>视频语音替换工具</h1>
<p class="hint">克隆视频中人物的音色，修改台词内容，无需对口型。整个流程只需上传一次视频。</p>

<div class="step" id="step1">
  <h2>第一步：上传视频</h2>
  <input type="file" id="videoInput" accept="video/*">
  <div class="hint">上传后会自动提取人物音色、识别原台词时间轴（可能需要一些时间，请耐心等待）</div>
  <br><br>
  <button id="uploadBtn">上传并识别</button>
  <div class="error" id="uploadError"></div>
</div>

<div class="step hidden" id="step2">
  <h2>第二步：编辑台词</h2>
  <p class="hint">每行格式为 [开始秒-结束秒] 文本内容，请只修改文本内容，保留时间戳标记。</p>
  <textarea id="scriptText"></textarea>
  <br><br>
  <button id="downloadScriptBtn">下载台词 txt</button>
  <span class="hint">（可下载到本地用文本编辑器修改，再粘贴回来或直接在上方编辑）</span>
</div>

<div class="step hidden" id="step3">
  <h2>第三步：生成替换后的视频</h2>
  <p class="hint">或者直接上传修改好的 txt 文件（会覆盖上方文本框内容）：</p>
  <input type="file" id="scriptFileInput" accept=".txt">
  <br><br>
  <button id="applyBtn">开始替换语音并生成视频</button>
  <div class="hint" id="applyStatus"></div>
  <div class="error" id="applyError"></div>
  <br>
  <a id="downloadLink" class="hidden" href="#">下载替换后的视频</a>
</div>

<script src="/static/main.js"></script>
</body>
</html>
